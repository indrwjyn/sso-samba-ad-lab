# Global parameters
[global]
	dns forwarder = 10.0.2.3
	netbios name = DC1
	realm = SINERGI.INTERNAL
	server role = active directory domain controller
	workgroup = SINERGI
	idmap_ldb:use rfc2307 = yes

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/sinergi.internal/scripts
	read only = No
